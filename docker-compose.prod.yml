version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: srb-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: srb_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-srb_password}
      POSTGRES_DB: secure_refund_bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: srb-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://srb_user:${DB_PASSWORD:-srb_password}@postgres:5432/secure_refund_bank
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECRET: ${COOKIE_SECRET}
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: srb-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

volumes:
  postgres_data:
